name: Shop temperature monitor

# How it keeps running: each "monitor" run checks every 15 minutes for about 5.5 hours,
# then starts the next run itself (GitHub allows a workflow to re-dispatch itself).
# The cron schedule below is only a backup in case the chain ever stops.
# To restart by hand: Actions > Shop temperature monitor > Run workflow > monitor.
# To stop it: cancel the running run (it will not restart itself), or Disable workflow.

on:
  schedule:
    - cron: '7 */6 * * *'   # backup: restarts the chain if it has stopped
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [monitor, list-devices, dry-run, test-slack]
        default: monitor

permissions:
  contents: write
  actions: write

concurrency:
  # only one monitoring chain at a time; test modes run separately
  group: temp-monitor-${{ inputs.mode || 'monitor' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      MODE: ${{ inputs.mode || 'monitor' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: One-off modes
        if: env.MODE != 'monitor'
        run: |
          [ -z "$GOVEE_API_KEY" ] && { echo "GOVEE_API_KEY not set"; exit 0; }
          case "$MODE" in
            list-devices) LIST_DEVICES=1 DRY_RUN=1 node src/monitor.js ;;
            dry-run)      DRY_RUN=1 node src/monitor.js ;;
            test-slack)   TEST_SLACK=1 node src/monitor.js ;;
          esac

      - name: Monitor every 15 minutes (about 5.5 hours)
        if: env.MODE == 'monitor'
        run: |
          if [ -z "$GOVEE_API_KEY" ]; then echo "::notice::GOVEE_API_KEY not added yet"; exit 0; fi
          [ -z "$SLACK_BOT_TOKEN" ] && export SLACK_PENDING=1
          git config user.name "temp-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 22); do
            start=$(date +%s)
            # pick up any code/config changes and the latest saved state
            git pull -q --rebase -X theirs || git rebase --abort || true
            node src/monitor.js || echo "::warning::check $i failed - will try again in 15 minutes"
            git add data docs
            git diff --cached --quiet || git commit -q -m "Update temperatures [skip ci]"
            git pull -q --rebase -X theirs || git rebase --abort || true
            git push -q || echo "::warning::push failed - will retry next check"
            if [ "$i" -lt 22 ]; then
              wait=$(( 900 - ($(date +%s) - start) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done

      - name: Start the next run
        if: (success() || failure()) && env.MODE == 'monitor'
        run: gh workflow run monitor.yml --ref main -f mode=monitor -R "$GITHUB_REPOSITORY"
