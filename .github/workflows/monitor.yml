name: Shop temperature monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (UTC; opening hours are handled in config.json)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [monitor, list-devices, dry-run, test-slack]
        default: monitor

permissions:
  contents: write

concurrency:
  group: temp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check temperatures
        id: run
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MODE: ${{ inputs.mode || 'monitor' }}
        run: |
          if [ -z "$GOVEE_API_KEY" ]; then
            echo "::notice::GOVEE_API_KEY secret not added yet - nothing to do."
            echo "save=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = "list-devices" ]; then
            LIST_DEVICES=1 DRY_RUN=1 node src/monitor.js
            echo "save=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = "test-slack" ]; then
            TEST_SLACK=1 node src/monitor.js
            echo "save=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = "dry-run" ]; then
            DRY_RUN=1 node src/monitor.js
            echo "save=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::warning::SLACK_BOT_TOKEN not added yet - readings and dashboard update, but no Slack messages are sent."
            export SLACK_PENDING=1
          fi
          node src/monitor.js
          echo "save=yes" >> "$GITHUB_OUTPUT"

      - name: Save state, dashboard and overnight report
        if: steps.run.outputs.save == 'yes'
        run: |
          git config user.name "temp-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update temperatures [skip ci]"
          git pull --rebase -X theirs || true
          git push
